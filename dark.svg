<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" fill="none" role="img" aria-label="Kishor Dewangan - Software Engineer Profile Hero">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#07111F"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>

    <radialGradient id="glow-violet" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-cyan" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="glass-panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="text-accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      
      .title-text { font-size: 32px; font-weight: 800; fill: #F8FAFC; letter-spacing: -0.5px; }
      .headline-text { font-size: 15px; font-weight: 600; fill: url(#text-accent-grad); letter-spacing: 0.5px; }
      .label-text { font-size: 12px; fill: #64748B; font-weight: 600; letter-spacing: 1px; }
      .value-text { font-size: 13px; fill: #E2E8F0; font-weight: 500; }
      .ascii-text { font-size: 11px; fill: #38BDF8; font-weight: 700; line-height: 1.2; letter-spacing: 1px; }
      .code-comment { font-size: 12px; fill: #475569; font-style: italic; }

      /* SMIL Fallback & CSS Animations */
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor { animation: blink 1s infinite; fill: #38BDF8; }
      
      @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-3px); } }
      .floating { animation: float 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1180" height="610" rx="20" fill="url(#bg-grad)"/>
  <rect width="1180" height="610" rx="20" fill="url(#grid)"/>
  <circle cx="200" cy="150" r="300" fill="url(#glow-violet)"/>
  <circle cx="950" cy="450" r="350" fill="url(#glow-cyan)"/>
  <rect x="2" y="2" width="1176" height="606" rx="18" fill="none" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- Top Terminal Header Bar -->
  <g transform="translate(25, 20)">
    <rect width="1130" height="40" rx="10" fill="#0F172A" fill-opacity="0.6" stroke="#1E293B" stroke-width="1"/>
    <circle cx="20" cy="20" r="6" fill="#EF4444"/>
    <circle cx="38" cy="20" r="6" fill="#F59E0B"/>
    <circle cx="56" cy="20" r="6" fill="#10B981"/>
    <text x="565" y="25" text-anchor="middle" class="mono" font-size="12" fill="#64748B">kishor@developer-node:~ (zsh)</text>
    <rect x="1030" y="10" width="80" height="20" rx="4" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.3"/>
    <circle cx="1042" cy="20" r="3" fill="#10B981"/>
    <text x="1052" y="24" class="mono" font-size="10" fill="#34D399" font-weight="700">ONLINE</text>
  </g>

  <!-- LEFT COLUMN: VISUAL / ASCII IDENTITY PANEL -->
  <g transform="translate(25, 75)">
    <rect width="430" height="510" rx="14" fill="url(#glass-panel)" stroke="#1E293B" stroke-width="1"/>
    
    <!-- ASCII Container Bar -->
    <path d="M 0 14 C 0 6, 6 0, 14 0 L 416 0 C 424 0, 430 6, 430 14 L 430 35 L 0 35 Z" fill="#1E293B" fill-opacity="0.5"/>
    <text x="15" y="22" class="mono" font-size="11" fill="#94A3B8" font-weight="600">VISUAL.MAP // IDENTITY_MATRIX</text>

    <!-- ASCII Portrait Rendering -->
    <g transform="translate(55, 60)" class="floating">
      <rect width="320" height="280" rx="8" fill="#030712" fill-opacity="0.8" stroke="#1E293B"/>
      <g transform="translate(20, 25)">
        <text class="mono ascii-text" y="0">
          <tspan x="0" dy="14">          .  :  +  *  #  %  @  %  #  *  +  :  .          </tspan>
          <tspan x="0" dy="13">       .  :  +  *  #  %  @  @  @  %  #  *  +  :  .       </tspan>
          <tspan x="0" dy="13">    .  :  +  *  #  %  @  @  @  @  @  %  #  *  +  :  .    </tspan>
          <tspan x="0" dy="13">  .  :  +  *  #  %  @  @  @  @  @  @  @  %  #  *  +  :  </tspan>
          <tspan x="0" dy="13"> :  +  *  #  %  %  %  %  %  %  %  %  %  %  %  #  *  +  :</tspan>
          <tspan x="0" dy="13">+  *  #  %  @  @  #  #  #  #  #  #  #  @  @  %  #  *  +</tspan>
          <tspan x="0" dy="13">*  #  %  @  @  #  +  :  .  .  .  :  +  #  @  @  %  #  *</tspan>
          <tspan x="0" dy="13">#  %  @  @  #  :  .             .  :  #  @  @  %  #</tspan>
          <tspan x="0" dy="13">%  @  @  @  *  .                   .  *  @  @  @  %</tspan>
          <tspan x="0" dy="13">@  @  @  @  +                         +  @  @  @  @</tspan>
          <tspan x="0" dy="13">%  @  @  @  *  .                   .  *  @  @  @  %</tspan>
          <tspan x="0" dy="13">#  %  @  @  #  :  .             .  :  #  @  @  %  #</tspan>
          <tspan x="0" dy="13">*  #  %  @  @  #  +  :  .  .  .  :  +  #  @  @  %  #  *</tspan>
          <tspan x="0" dy="13">+  *  #  %  @  @  #  #  #  #  #  #  #  @  @  %  #  *  +</tspan>
          <tspan x="0" dy="13"> :  +  *  #  %  %  %  %  %  %  %  %  %  %  %  #  *  +  :</tspan>
          <tspan x="0" dy="13">  .  :  +  *  #  %  @  @  @  @  @  @  @  %  #  *  +  :  </tspan>
          <tspan x="0" dy="13">    .  :  +  *  #  %  @  @  @  @  @  %  #  *  +  :  .    </tspan>
          <tspan x="0" dy="13">       .  :  +  *  #  %  @  @  @  %  #  *  +  :  .       </tspan>
        </text>
      </g>
      <!-- Scanline overlay effect -->
      <rect width="320" height="280" rx="8" fill="none" stroke="#38BDF8" stroke-opacity="0.2" stroke-width="1"/>
    </g>

    <!-- Sub Identity Details -->
    <g transform="translate(25, 365)">
      <text x="0" y="0" class="mono" font-size="13" fill="#38BDF8" font-weight="700">&gt; KISHOR_DEWANGAN.sys</text>
      <text x="0" y="22" class="sans" font-size="13" fill="#94A3B8">CS Student @ SSTC Bhilai ('26)</text>
      <text x="0" y="42" class="sans" font-size="12" fill="#64748B">Real-Time Systems | Full-Stack | Security</text>
      
      <rect x="0" y="65" width="380" height="50" rx="8" fill="#030712" fill-opacity="0.6" stroke="#1E293B"/>
      <text x="15" y="85" class="mono code-comment">// Psychology &amp; Behavioral Logic</text>
      <text x="15" y="102" class="mono" font-size="11" fill="#34D399">~/mentalist-mindset $ <tspan fill="#F8FAFC">exec --insight</tspan><tspan class="cursor">_</tspan></text>
    </g>
  </g>

  <!-- RIGHT COLUMN: SYSTEM.INFO PANEL -->
  <g transform="translate(475, 75)">
    <rect width="680" height="510" rx="14" fill="url(#glass-panel)" stroke="#1E293B" stroke-width="1"/>
    
    <!-- System Info Header -->
    <path d="M 0 14 C 0 6, 6 0, 14 0 L 666 0 C 674 0, 680 6, 680 14 L 680 35 L 0 35 Z" fill="#1E293B" fill-opacity="0.5"/>
    <text x="20" y="22" class="mono" font-size="11" fill="#94A3B8" font-weight="600">SYSTEM.INFO // PROFILE_METRICS</text>
    <text x="660" y="22" text-anchor="end" class="mono" font-size="11" fill="#475569">v2.6.0</text>

    <!-- Main Title & Headline -->
    <g transform="translate(35, 65)">
      <text x="0" y="0" class="sans title-text">Kishor Dewangan</text>
      <text x="0" y="25" class="sans headline-text">Python &amp; Full Stack Developer · Real-Time Systems Specialist</text>
    </g>

    <line x1="35" y1="110" x2="645" y2="110" stroke="#1E293B" stroke-width="1"/>

    <!-- Key Details Table / Grid -->
    <g transform="translate(35, 135)">
      <!-- Row 1 -->
      <text x="0" y="0" class="mono label-text">ROLE</text>
      <text x="120" y="0" class="sans value-text" font-weight="600" fill="#38BDF8">Software Engineering Student / Full Stack Developer</text>

      <!-- Row 2 -->
      <text x="0" y="30" class="mono label-text">INSTITUTION</text>
      <text x="120" y="30" class="sans value-text">Shri Shankaracharya Technical Campus (SSTC), Bhilai</text>

      <!-- Row 3 -->
      <text x="0" y="60" class="mono label-text">LOCATION</text>
      <text x="120" y="60" class="sans value-text">Chhattisgarh, India 🇮🇳</text>

      <!-- Row 4 -->
      <text x="0" y="90" class="mono label-text">FOCUS</text>
      <text x="120" y="90" class="sans value-text">Real-Time Distributed Systems, Cybersecurity (LSB Steganography)</text>
    </g>

    <!-- Technical Stack Section -->
    <g transform="translate(35, 260)">
      <text x="0" y="0" class="mono label-text">TECH_STACK</text>
      
      <!-- Tech Stack Pills -->
      <g transform="translate(0, 15)">
        <!-- Pill 1 -->
        <rect x="0" y="0" width="85" height="26" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.4"/>
        <text x="42" y="17" text-anchor="middle" class="mono" font-size="11" fill="#E2E8F0">Python</text>
        
        <!-- Pill 2 -->
        <rect x="95" y="0" width="95" height="26" rx="6" fill="#1E293B" stroke="#818CF8" stroke-opacity="0.4"/>
        <text x="142" y="17" text-anchor="middle" class="mono" font-size="11" fill="#E2E8F0">JavaScript</text>

        <!-- Pill 3 -->
        <rect x="200" y="0" width="75" height="26" rx="6" fill="#1E293B" stroke="#C084FC" stroke-opacity="0.4"/>
        <text x="237" y="17" text-anchor="middle" class="mono" font-size="11" fill="#E2E8F0">Flask</text>

        <!-- Pill 4 -->
        <rect x="285" y="0" width="105" height="26" rx="6" fill="#1E293B" stroke="#34D399" stroke-opacity="0.4"/>
        <text x="337" y="17" text-anchor="middle" class="mono" font-size="11" fill="#E2E8F0">WebSockets</text>

        <!-- Pill 5 -->
        <rect x="400" y="0" width="95" height="26" rx="6" fill="#1E293B" stroke="#F43F5E" stroke-opacity="0.4"/>
        <text x="447" y="17" text-anchor="middle" class="mono" font-size="11" fill="#E2E8F0">Socket.io</text>

        <!-- Pill 6 -->
        <rect x="505" y="0" width="105" height="26" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-opacity="0.4"/>
        <text x="557" y="17" text-anchor="middle" class="mono" font-size="11" fill="#E2E8F0">Steganography</text>
      </g>
    </g>

    <!-- Featured Projects Section -->
    <g transform="translate(35, 335)">
      <text x="0" y="0" class="mono label-text">FEATURED_PROJECTS</text>
      
      <!-- Project 1 -->
      <g transform="translate(0, 15)">
        <rect width="610" height="42" rx="6" fill="#030712" fill-opacity="0.5" stroke="#1E293B"/>
        <text x="15" y="25" class="mono" font-size="12" font-weight="700" fill="#38BDF8">Real-Time Collaborative Code IDE</text>
        <text x="240" y="25" class="sans" font-size="12" fill="#94A3B8">| Low-latency live collaboration engine (Flask + WebSockets)</text>
      </g>

      <!-- Project 2 -->
      <g transform="translate(0, 65)">
        <rect width="610" height="42" rx="6" fill="#030712" fill-opacity="0.5" stroke="#1E293B"/>
        <text x="15" y="25" class="mono" font-size="12" font-weight="700" fill="#818CF8">Image Steganography Tool</text>
        <text x="220" y="25" class="sans" font-size="12" fill="#94A3B8">| LSB algorithm payload hider in Python</text>
      </g>
    </g>

    <!-- Quick Footer / Terminal Prompt -->
    <g transform="translate(35, 465)">
      <text x="0" y="0" class="mono" font-size="11" fill="#475569">&gt; Status: Open for Software Engineer / Backend Internships &amp; Roles</text>
    </g>
  </g>
</svg>
