<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" fill="none" role="img" aria-label="Kishor Dewangan - Software Engineer Profile Hero (Light Theme)">
  <defs>
    <!-- Light Background Gradients -->
    <linearGradient id="bg-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <radialGradient id="glow-blue-light" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-indigo-light" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="border-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#E2E8F0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="glass-panel-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="text-accent-grad-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <pattern id="grid-light" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#E2E8F0" stroke-width="0.8"/>
    </pattern>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      
      .title-text-light { font-size: 32px; font-weight: 800; fill: #0F172A; letter-spacing: -0.5px; }
      .headline-text-light { font-size: 15px; font-weight: 600; fill: url(#text-accent-grad-light); letter-spacing: 0.5px; }
      .label-text-light { font-size: 12px; fill: #64748B; font-weight: 600; letter-spacing: 1px; }
      .value-text-light { font-size: 13px; fill: #334155; font-weight: 500; }
      .ascii-text-light { font-size: 11px; fill: #2563EB; font-weight: 700; line-height: 1.2; letter-spacing: 1px; }
      .code-comment-light { font-size: 12px; fill: #64748B; font-style: italic; }

      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor-light { animation: blink 1s infinite; fill: #2563EB; }
      
      @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-3px); } }
      .floating { animation: float 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1180" height="610" rx="20" fill="url(#bg-grad-light)"/>
  <rect width="1180" height="610" rx="20" fill="url(#grid-light)"/>
  <circle cx="200" cy="150" r="300" fill="url(#glow-blue-light)"/>
  <circle cx="950" cy="450" r="350" fill="url(#glow-indigo-light)"/>
  <rect x="2" y="2" width="1176" height="606" rx="18" fill="none" stroke="url(#border-grad-light)" stroke-width="1.5"/>

  <!-- Top Terminal Header Bar -->
  <g transform="translate(25, 20)">
    <rect width="1130" height="40" rx="10" fill="#FFFFFF" fill-opacity="0.9" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="20" cy="20" r="6" fill="#EF4444"/>
    <circle cx="38" cy="20" r="6" fill="#F59E0B"/>
    <circle cx="56" cy="20" r="6" fill="#10B981"/>
    <text x="565" y="25" text-anchor="middle" class="mono" font-size="12" fill="#64748B">kishor@developer-node:~ (zsh)</text>
    <rect x="1030" y="10" width="80" height="20" rx="4" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-opacity="0.4"/>
    <circle cx="1042" cy="20" r="3" fill="#059669"/>
    <text x="1052" y="24" class="mono" font-size="10" fill="#059669" font-weight="700">ONLINE</text>
  </g>

  <!-- LEFT COLUMN: VISUAL / ASCII IDENTITY PANEL -->
  <g transform="translate(25, 75)">
    <rect width="430" height="510" rx="14" fill="url(#glass-panel-light)" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- ASCII Container Bar -->
    <path d="M 0 14 C 0 6, 6 0, 14 0 L 416 0 C 424 0, 430 6, 430 14 L 430 35 L 0 35 Z" fill="#F1F5F9"/>
    <text x="15" y="22" class="mono" font-size="11" fill="#475569" font-weight="600">VISUAL.MAP // IDENTITY_MATRIX</text>

    <!-- ASCII Portrait Rendering -->
    <g transform="translate(55, 60)" class="floating">
      <rect width="320" height="280" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <g transform="translate(20, 25)">
        <text class="mono ascii-text-light" y="0">
          <tspan x="0" dy="14">          .  :  +  *  #  %  @  %  #  *  +  :  .          </tspan>
          <tspan x="0" dy="13">       .  :  +  *  #  %  @  @  @  %  #  *  +  :  .       </tspan>
          <tspan x="0" dy="13">    .  :  +  *  #  %  @  @  @  @  @  %  #  *  +  :  .    </tspan>
          <tspan x="0" dy="13">  .  :  +  *  #  %  @  @  @  @  @  @  @  %  #  *  +  :  </tspan>
          <tspan x="0" dy="13"> :  +  *  #  %  %  %  %  %  %  %  %  %  %  %  #  *  +  :</tspan>
          <tspan x="0" dy="13">+  *  #  %  @  @  #  #  #  #  #  #  #  @  @  %  #  *  +</tspan>
          <tspan x="0" dy="13">*  #  %  @  @  #  +  :  .  .  .  :  +  #  @  @  %  #  *</tspan>
          <tspan x="0" dy="13">#  %  @  @  #  :  .             .  :  #  @  @  %  #</tspan>
          <tspan x="0" dy="13">%  @  @  @  *  .                   .  *  @  @  @  %</tspan>
          <tspan x="0" dy="13">@  @  @  @  +                         +  @  @  @  @</tspan>
          <tspan x="0" dy="13">%  @  @  @  *  .                   .  *  @  @  @  %</tspan>
          <tspan x="0" dy="13">#  %  @  @  #  :  .             .  :  #  @  @  %  #</tspan>
          <tspan x="0" dy="13">*  #  %  @  @  #  +  :  .  .  .  :  +  #  @  @  %  #  *</tspan>
          <tspan x="0" dy="13">+  *  #  %  @  @  #  #  #  #  #  #  #  @  @  %  #  *  +</tspan>
          <tspan x="0" dy="13"> :  +  *  #  %  %  %  %  %  %  %  %  %  %  %  #  *  +  :</tspan>
          <tspan x="0" dy="13">  .  :  +  *  #  %  @  @  @  @  @  @  @  %  #  *  +  :  </tspan>
          <tspan x="0" dy="13">    .  :  +  *  #  %  @  @  @  @  @  %  #  *  +  :  .    </tspan>
          <tspan x="0" dy="13">       .  :  +  *  #  %  @  @  @  %  #  *  +  :  .       </tspan>
        </text>
      </g>
      <rect width="320" height="280" rx="8" fill="none" stroke="#2563EB" stroke-opacity="0.2" stroke-width="1"/>
    </g>

    <!-- Sub Identity Details -->
    <g transform="translate(25, 365)">
      <text x="0" y="0" class="mono" font-size="13" fill="#2563EB" font-weight="700">&gt; KISHOR_DEWANGAN.sys</text>
      <text x="0" y="22" class="sans" font-size="13" fill="#475569">CS Student @ SSTC Bhilai ('26)</text>
      <text x="0" y="42" class="sans" font-size="12" fill="#64748B">Real-Time Systems | Full-Stack | Security</text>
      
      <rect x="0" y="65" width="380" height="50" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text x="15" y="85" class="mono code-comment-light">// Psychology &amp; Behavioral Logic</text>
      <text x="15" y="102" class="mono" font-size="11" fill="#059669">~/mentalist-mindset $ <tspan fill="#0F172A">exec --insight</tspan><tspan class="cursor-light">_</tspan></text>
    </g>
  </g>

  <!-- RIGHT COLUMN: SYSTEM.INFO PANEL -->
  <g transform="translate(475, 75)">
    <rect width="680" height="510" rx="14" fill="url(#glass-panel-light)" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- System Info Header -->
    <path d="M 0 14 C 0 6, 6 0, 14 0 L 666 0 C 674 0, 680 6, 680 14 L 680 35 L 0 35 Z" fill="#F1F5F9"/>
    <text x="20" y="22" class="mono" font-size="11" fill="#475569" font-weight="600">SYSTEM.INFO // PROFILE_METRICS</text>
    <text x="660" y="22" text-anchor="end" class="mono" font-size="11" fill="#94A3B8">v2.6.0</text>

    <!-- Main Title & Headline -->
    <g transform="translate(35, 65)">
      <text x="0" y="0" class="sans title-text-light">Kishor Dewangan</text>
      <text x="0" y="25" class="sans headline-text-light">Python &amp; Full Stack Developer · Real-Time Systems Specialist</text>
    </g>

    <line x1="35" y1="110" x2="645" y2="110" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Key Details Table / Grid -->
    <g transform="translate(35, 135)">
      <!-- Row 1 -->
      <text x="0" y="0" class="mono label-text-light">ROLE</text>
      <text x="120" y="0" class="sans value-text-light" font-weight="600" fill="#2563EB">Software Engineering Student / Full Stack Developer</text>

      <!-- Row 2 -->
      <text x="0" y="30" class="mono label-text-light">INSTITUTION</text>
      <text x="120" y="30" class="sans value-text-light">Shri Shankaracharya Technical Campus (SSTC), Bhilai</text>

      <!-- Row 3 -->
      <text x="0" y="60" class="mono label-text-light">LOCATION</text>
      <text x="120" y="60" class="sans value-text-light">Chhattisgarh, India 🇮🇳</text>

      <!-- Row 4 -->
      <text x="0" y="90" class="mono label-text-light">FOCUS</text>
      <text x="120" y="90" class="sans value-text-light">Real-Time Distributed Systems, Cybersecurity (LSB Steganography)</text>
    </g>

    <!-- Technical Stack Section -->
    <g transform="translate(35, 260)">
      <text x="0" y="0" class="mono label-text-light">TECH_STACK</text>
      
      <!-- Tech Stack Pills -->
      <g transform="translate(0, 15)">
        <!-- Pill 1 -->
        <rect x="0" y="0" width="85" height="26" rx="6" fill="#F1F5F9" stroke="#2563EB" stroke-opacity="0.4"/>
        <text x="42" y="17" text-anchor="middle" class="mono" font-size="11" fill="#1E293B">Python</text>
        
        <!-- Pill 2 -->
        <rect x="95" y="0" width="95" height="26" rx="6" fill="#F1F5F9" stroke="#4F46E5" stroke-opacity="0.4"/>
        <text x="142" y="17" text-anchor="middle" class="mono" font-size="11" fill="#1E293B">JavaScript</text>

        <!-- Pill 3 -->
        <rect x="200" y="0" width="75" height="26" rx="6" fill="#F1F5F9" stroke="#9333EA" stroke-opacity="0.4"/>
        <text x="237" y="17" text-anchor="middle" class="mono" font-size="11" fill="#1E293B">Flask</text>

        <!-- Pill 4 -->
        <rect x="285" y="0" width="105" height="26" rx="6" fill="#F1F5F9" stroke="#059669" stroke-opacity="0.4"/>
        <text x="337" y="17" text-anchor="middle" class="mono" font-size="11" fill="#1E293B">WebSockets</text>

        <!-- Pill 5 -->
        <rect x="400" y="0" width="95" height="26" rx="6" fill="#F1F5F9" stroke="#E11D48" stroke-opacity="0.4"/>
        <text x="447" y="17" text-anchor="middle" class="mono" font-size="11" fill="#1E293B">Socket.io</text>

        <!-- Pill 6 -->
        <rect x="505" y="0" width="105" height="26" rx="6" fill="#F1F5F9" stroke="#D97706" stroke-opacity="0.4"/>
        <text x="557" y="17" text-anchor="middle" class="mono" font-size="11" fill="#1E293B">Steganography</text>
      </g>
    </g>

    <!-- Featured Projects Section -->
    <g transform="translate(35, 335)">
      <text x="0" y="0" class="mono label-text-light">FEATURED_PROJECTS</text>
      
      <!-- Project 1 -->
      <g transform="translate(0, 15)">
        <rect width="610" height="42" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="15" y="25" class="mono" font-size="12" font-weight="700" fill="#2563EB">Real-Time Collaborative Code IDE</text>
        <text x="240" y="25" class="sans" font-size="12" fill="#64748B">| Low-latency live collaboration engine (Flask + WebSockets)</text>
      </g>

      <!-- Project 2 -->
      <g transform="translate(0, 65)">
        <rect width="610" height="42" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="15" y="25" class="mono" font-size="12" font-weight="700" fill="#4F46E5">Image Steganography Tool</text>
        <text x="220" y="25" class="sans" font-size="12" fill="#64748B">| LSB algorithm payload hider in Python</text>
      </g>
    </g>

    <!-- Quick Footer / Terminal Prompt -->
    <g transform="translate(35, 465)">
      <text x="0" y="0" class="mono" font-size="11" fill="#64748B">&gt; Status: Open for Software Engineer / Backend Internships &amp; Roles</text>
    </g>
  </g>
</svg>
